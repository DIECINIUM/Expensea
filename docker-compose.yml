name: spendgraph-ai

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-SpendGraph AI API}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_HOST: 0.0.0.0
  API_PORT: 8000
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
  DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
  DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-4000-8000-000000000001}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8000/auth/callback}
  AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:5173}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-28800}
  OAUTH_STATE_SECONDS: ${OAUTH_STATE_SECONDS:-600}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8000/connections/gmail/callback}
  GMAIL_SYNC_MAX_RESULTS: ${GMAIL_SYNC_MAX_RESULTS:-20}
  GMAIL_OPERATION_TIMEOUT_SECONDS: ${GMAIL_OPERATION_TIMEOUT_SECONDS:-120}
  TOKEN_ENCRYPTION_ACTIVE_KEY_ID: ${TOKEN_ENCRYPTION_ACTIVE_KEY_ID:-}
  TOKEN_ENCRYPTION_KEYS: '${TOKEN_ENCRYPTION_KEYS:-{}}'
  JOBS_CONCURRENCY: ${JOBS_CONCURRENCY:-4}
  JOBS_MAX_PENDING: ${JOBS_MAX_PENDING:-1000}
  JOBS_MAX_PENDING_PER_OWNER: ${JOBS_MAX_PENDING_PER_OWNER:-50}
  JOBS_MAX_ATTEMPTS: ${JOBS_MAX_ATTEMPTS:-3}
  JOBS_LEASE_SECONDS: ${JOBS_LEASE_SECONDS:-180}
  JOBS_TIMEOUT_SECONDS: ${JOBS_TIMEOUT_SECONDS:-120}
  JOBS_POLL_SECONDS: ${JOBS_POLL_SECONDS:-1}
  JOBS_BACKOFF_SECONDS: ${JOBS_BACKOFF_SECONDS:-2}
  JOBS_MAX_BACKOFF_SECONDS: ${JOBS_MAX_BACKOFF_SECONDS:-300}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  AI_PROVIDER: ${AI_PROVIDER:-disabled}
  AI_BASE_URL: ${AI_BASE_URL:-http://127.0.0.1:11434}
  AI_MODEL: ${AI_MODEL:-gemma4:e4b}
  AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
  AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-2}
  AI_RETRY_BACKOFF_SECONDS: ${AI_RETRY_BACKOFF_SECONDS:-0.25}
  AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-8000}
  AI_REVIEW_CONFIDENCE_THRESHOLD: ${AI_REVIEW_CONFIDENCE_THRESHOLD:-0.85}
  RECONCILIATION_CANDIDATE_WINDOW_MINUTES: ${RECONCILIATION_CANDIDATE_WINDOW_MINUTES:-1440}
  RECONCILIATION_MAX_CANDIDATES: ${RECONCILIATION_MAX_CANDIDATES:-20}
  RECONCILIATION_POSSIBLE_DUPLICATE_THRESHOLD: ${RECONCILIATION_POSSIBLE_DUPLICATE_THRESHOLD:-0.70}
  RECONCILIATION_AUTO_MERGE_THRESHOLD: ${RECONCILIATION_AUTO_MERGE_THRESHOLD:-0.92}
  RECONCILIATION_AMOUNT_WEIGHT: ${RECONCILIATION_AMOUNT_WEIGHT:-0.35}
  RECONCILIATION_TIME_WEIGHT: ${RECONCILIATION_TIME_WEIGHT:-0.25}
  RECONCILIATION_MERCHANT_WEIGHT: ${RECONCILIATION_MERCHANT_WEIGHT:-0.20}
  RECONCILIATION_DESCRIPTION_WEIGHT: ${RECONCILIATION_DESCRIPTION_WEIGHT:-0.20}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-spendgraph}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendgraph}
  POSTGRES_DB: ${POSTGRES_DB:-spendgraph}
  DATABASE_URL: ${DATABASE_URL:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendgraph}
      POSTGRES_DB: ${POSTGRES_DB:-spendgraph}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spendgraph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
      target: development
    environment:
      <<: *api-environment
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
    command:
      [
        "sh",
        "-c",
        'alembic -c alembic.ini upgrade head && if [ "$${DEMO_SEED_ENABLED}" = "true" ]; then python -m app.seed; fi',
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      target: development
    environment:
      <<: *api-environment
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      target: development
    environment:
      <<: *api-environment
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - ./apps/api:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: development
    environment:
      VITE_GRAPHQL_URL: /graphql
      VITE_DEV_API_TARGET: http://api:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  spendgraph_postgres_data:
