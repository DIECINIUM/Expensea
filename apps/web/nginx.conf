# Only Caddy is exposed publicly; it replaces untrusted forwarding headers.
map $http_x_forwarded_for $request_client {
    "" $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $request_client zone=api_limit:10m rate=30r/s;
limit_req_zone $request_client zone=auth_limit:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        # OAuth callback query parameters contain codes. Do not access-log them.
        access_log off;
    }

    location ~ ^/(graphql|api/|connections/|agent/|jobs/|ready$|health$) {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
